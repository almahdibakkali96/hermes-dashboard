<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ArabTides — فيديو سمكة الأسبوع</title>
<link rel="stylesheet" href="brand.css">
<style>
  /* 1080×1920 Reel styled as a swiping carousel. Frames are rendered by calling window.renderAt(seconds).
     Reels safe area: keep text inside x 90–930, y 230–1480. Photos and flags come from the website's public/. */
  html, body { background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: #fff;
    background: radial-gradient(900px 600px at 85% 8%, rgba(45, 212, 191, .18), transparent 60%),
      linear-gradient(180deg, #06162a 0%, #0b2540 40%, #0f3d5c 72%, #155a6b 80%); }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  /* left/top 0: in RTL an unanchored absolute box starts at the right edge */
  .fish { position: absolute; left: 0; top: 0; width: 150px; height: 75px; margin: -37px 0 0 -75px; will-change: transform; }
  #world { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .d { font-family: var(--font-display); font-weight: 700; word-spacing: .12em; }
  .k { font-family: var(--font-num); direction: ltr; unicode-bidi: isolate; }
  .sh { text-shadow: 0 4px 24px rgba(6, 22, 42, .6); }

  /* Carousel chrome */
  #dots { position: absolute; top: 236px; left: 0; width: 1080px; display: flex; justify-content: center; gap: 14px; }
  #dots i { width: 16px; height: 16px; border-radius: 50%; background: rgba(255, 255, 255, .3); transition: none; }
  #dots i.on { width: 48px; border-radius: 8px; background: var(--lagoon); }

  .slide { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; padding: 290px 100px 0; display: flex; flex-direction: column; align-items: center; text-align: center; will-change: transform; }
  .photo { position: relative; width: 880px; height: 500px; border-radius: 36px; overflow: hidden; background: #0b2540;
    box-shadow: 0 30px 70px rgba(0, 0, 0, .45), 0 0 0 4px rgba(255, 255, 255, .12); }
  .photo .blur { position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); object-fit: cover; filter: blur(28px) brightness(.7); }
  .photo .img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .photo .tag { position: absolute; top: 22px; right: 22px; background: rgba(11, 37, 64, .82); color: var(--sand); font-size: 34px; font-weight: 700; padding: 6px 22px; border-radius: 999px; }
  .name { margin-top: 34px; font-size: 116px; line-height: 1.05; }
  .sci { margin-top: 6px; font-size: 34px; color: var(--mist); font-style: italic; }
  .chips { margin-top: 26px; display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; max-width: 900px; }
  .chip { display: inline-flex; align-items: center; gap: 14px; padding: 10px 26px 10px 20px; border-radius: 999px; background: rgba(255, 255, 255, .1); border: 2px solid rgba(255, 255, 255, .18); font-size: 44px; font-weight: 700; }
  .chip img { width: 46px; height: 34px; border-radius: 5px; object-fit: cover; box-shadow: 0 0 0 2px rgba(255, 255, 255, .25); }
  .chip .fl { display: inline-flex; gap: 6px; }
  .fact { margin-top: 30px; max-width: 880px; font-size: 46px; line-height: 1.5; font-weight: 700; color: #e2f6f3; }
  .fact b { color: var(--sand); }
  .ask { margin-top: 22px; display: inline-block; padding: 8px 28px; border-radius: 999px; background: var(--lagoon); color: var(--navy); font-size: 38px; font-weight: 700; }

  /* Cover */
  #c0 .kick { margin-top: 40px; font-size: 54px; color: var(--lagoon); font-weight: 700; }
  #c0 .t { margin-top: 14px; font-size: 168px; line-height: 1.1; }
  #c0 .sub { margin-top: 26px; font-size: 56px; line-height: 1.4; font-weight: 700; color: var(--sand); }
  #ring { position: relative; margin-top: 40px; width: 880px; height: 440px; }
  #ring img { position: absolute; width: 230px; height: 230px; border-radius: 50%; object-fit: cover; border: 6px solid var(--lagoon); box-shadow: 0 16px 40px rgba(0, 0, 0, .45); left: 0; top: 0; }

  /* End card */
  #c7 img.logo { margin-top: 30px; width: 200px; height: 200px; }
  #c7 .q { margin-top: 36px; font-size: 96px; line-height: 1.25; }
  #c7 .p { margin-top: 30px; font-size: 54px; line-height: 1.5; font-weight: 700; color: var(--sand); }
  #c7 .url { margin-top: 40px; font-family: var(--font-num); font-weight: 800; font-size: 84px; color: var(--lagoon); direction: ltr; }
  #c7 .cm { margin-top: 30px; font-size: 120px; }
</style>
</head>
<body>
<div id="stage">
  <!-- Shore panorama along the bottom: rocks · beach · breakwater with lighthouse; the sea moves with the tide -->
  <svg id="world" viewBox="0 0 1080 1920" aria-hidden="true">
    <defs>
      <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".55"/><stop offset=".25" stop-color="#0d6e7a" stop-opacity=".85"/><stop offset="1" stop-color="#0a3f55"/></linearGradient>
      <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6c88f"/><stop offset="1" stop-color="#b8925a"/></linearGradient>
      <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#64707c"/><stop offset="1" stop-color="#2f3943"/></linearGradient>
      <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9aa5ae"/><stop offset="1" stop-color="#6b7681"/></linearGradient>
      <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fde68a" stop-opacity=".5"/><stop offset="1" stop-color="#fde68a" stop-opacity="0"/></linearGradient>
    </defs>
    <path d="M0 1690 C40 1590 90 1550 150 1560 C200 1510 260 1530 300 1600 C320 1640 330 1670 340 1690 Z" fill="url(#rock)"/>
    <path d="M330 1690 C420 1640 560 1635 700 1690 Z" fill="url(#sand)"/>
    <rect x="720" y="1610" width="360" height="100" fill="url(#wall)"/>
    <path d="M965 1610 L975 1400 L1005 1400 L1015 1610 Z" fill="#f4f8f9"/><path d="M969 1535 h42 v28 h-42z M972 1460 h36 v26 h-36z" fill="#f43f5e"/><rect x="965" y="1375" width="50" height="28" rx="6" fill="#fde68a"/>
    <path id="beam" d="M990 1389 L560 1345 L560 1435 Z" fill="url(#beam)"/>
    <g id="boat"><path d="M-80 0 L80 0 L58 34 L-58 34 Z" fill="#f4f8f9"/><path d="M-80 0 L80 0 L76 9 L-76 9Z" fill="#0d9488"/><line x1="0" y1="0" x2="0" y2="-120" stroke="#e2e8f0" stroke-width="5"/><path d="M5 -112 L58 -14 L5 -14Z" fill="#fde68a" opacity=".9"/></g>
    <path id="wv" fill="url(#sea)"/>
  </svg>
  <div class="layer" id="fishLayer"></div>

  <div id="dots"></div>

  <!-- 0 · Cover -->
  <div class="slide" id="c0">
    <div class="kick sh">🎣 من الخليج إلى المحيط</div>
    <div class="d t sh">سمكة<br>الأسبوع</div>
    <div class="sub sh">٦ أسماك… ولكل سمكة أكثر من اسم</div>
    <div id="ring"></div>
  </div>

  <!-- 1–6 · Fish slides (filled from FISH below) -->

  <!-- 7 · End card -->
  <div class="slide" id="c7">
    <img class="logo" src="../logo/arabtides-mark.svg" alt="">
    <div class="d q sh">ماذا تسمّونها<br>في بلدكم؟</div>
    <div class="p sh">اكتب الاسم المحلي في التعليقات<br>ونضيفه إلى دليل الأسماك</div>
    <div class="cm">👇💬</div>
    <div class="url">arabtides.com/fish</div>
  </div>
</div>

<script>
  var $ = function (s) { return document.querySelector(s); };
  var clamp = function (x) { return Math.max(0, Math.min(1, x)); };
  var ease = function (x) { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  var out = function (x) { x = clamp(x); return 1 - Math.pow(1 - x, 3); };
  var seg = function (t, a, b, f) { return (f || ease)((t - a) / (b - a)); };
  var show = function (el, o, dy) { el.style.opacity = o; el.style.transform = 'translateY(' + (dy || 0) + 'px)'; };
  var lerp = function (a, b, p) { return a + (b - a) * p; };
  var seed = 7, rnd = function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  var PHOTO = '../../public/fish/', FLAG = '../../public/flags/';

  // Scene boundaries in design seconds (voiceover.mjs reads this line)
  var DESIGN = [0, 5, 10.5, 16, 21.5, 27, 32.5, 38, 45];

  // One slide per fish: local names with the flags of the countries that use them, and one surprising fact
  var FISH = [
    { id: 'kanad', name: 'كنعد', sci: 'Scomberomorus commerson', sea: 'الخليج والبحر الأحمر',
      names: [['كنعد', ['kw', 'sa', 'ae', 'om']], ['درّاك', ['eg']]],
      fact: 'أسنانه <b>تقطع الخيط</b>، وعاد موسم صيده في الخليج بعد منع التكاثر' },
    { id: 'hamour', name: 'هامور', sci: 'Epinephelus coioides', sea: 'الخليج والبحر الأحمر',
      names: [['هامور', ['qa', 'bh', 'ae', 'sa']], ['وقار', ['eg']]],
      fact: 'يبدأ حياته <b>أنثى</b>، ثم يتحوّل إلى <b>ذكر</b> عندما يكبر' },
    { id: 'parrot', name: 'حريد', sci: 'Scarus ferrugineus', sea: 'البحر الأحمر',
      names: [['حريد', ['sa', 'ye', 'om']], ['سمك الببغاء', []]],
      fact: 'يأكل المرجان ويحوّله إلى <b>رمل أبيض</b>، وينام داخل <b>فقاعة من المخاط</b>' },
    { id: 'dorade', name: 'دنيس', sci: 'Sparus aurata', sea: 'البحر المتوسط',
      names: [['دنيس', ['eg', 'lb', 'sy']], ['وراطة', ['tn']], ['دوراد', ['ma', 'dz']]],
      fact: 'على جبينه <b>خط ذهبي</b>، وأسنانه تكسر الأصداف والسرطانات' },
    { id: 'meagre', name: 'كوربين', sci: 'Argyrosomus regius', sea: 'الأطلسي والمتوسط',
      names: [['كوربين', ['ma', 'mr', 'tn']], ['لوت', ['eg']]],
      fact: 'يُصدر صوتاً <b>كالطبل</b> تحت الماء، يسمعه الصيادون من القارب' },
    { id: 'safi', name: 'صافي', sci: 'Siganus spp.', sea: 'الخليج والأحمر والمتوسط',
      names: [['صافي', ['ae', 'om']], ['بطاطا', ['kw']], ['سيجان', ['eg', 'lb']]],
      fact: 'عبر <b>قناة السويس</b> إلى البحر المتوسط… وأشواكه <b>سامّة</b>' },
  ];

  // Build the fish slides before the end card
  var endCard = $('#c7');
  FISH.forEach(function (f, n) {
    var s = document.createElement('div');
    s.className = 'slide'; s.id = 'c' + (n + 1);
    s.innerHTML =
      '<div class="photo"><img class="blur" src="' + PHOTO + f.id + '.webp" alt=""><img class="img" src="' + PHOTO + f.id + '.webp" alt=""><span class="tag">' + f.sea + '</span></div>' +
      '<div class="d name sh">' + f.name + '</div>' +
      '<div class="sci k">' + f.sci + '</div>' +
      '<div class="chips">' + f.names.map(function (nm) {
        return '<span class="chip">' + (nm[1].length ? '<span class="fl">' + nm[1].map(function (c) { return '<img src="' + FLAG + c + '.svg" alt="">'; }).join('') + '</span>' : '') + nm[0] + '</span>';
      }).join('') + '</div>' +
      '<div class="fact sh">' + f.fact + '</div>' +
      '<div class="ask">وفي بلدك؟ اكتب الاسم 💬</div>';
    $('#stage').insertBefore(s, endCard);
  });
  var slides = document.querySelectorAll('.slide');
  for (var n = 0; n < slides.length; n++) $('#dots').appendChild(document.createElement('i'));
  var dots = document.querySelectorAll('#dots i');

  // Cover: six round photos placed in two rows
  var RING = [[60, 10], [325, 0], [590, 10], [60, 210], [325, 200], [590, 210]];
  FISH.forEach(function (f, n) { var im = document.createElement('img'); im.src = PHOTO + f.id + '.webp'; im.alt = ''; $('#ring').appendChild(im); });
  var ringImgs = document.querySelectorAll('#ring img');

  // --- Cartoon fish swimming under the shore panorama (same component as the earlier Reels)
  var COLORS = [['#2dd4bf', '#14b8a6'], ['#fde68a', '#f5c94a'], ['#5eead4', '#0d9488'], ['#fca5a5', '#f87171'], ['#93c5fd', '#60a5fa']];
  var fish = [];
  for (var i = 0; i < 7; i++) {
    var c = COLORS[i % COLORS.length], el = document.createElement('div');
    el.className = 'fish';
    el.innerHTML = '<svg viewBox="0 0 150 75" width="150" height="75">' +
      '<path class="tail" d="M108 37 L146 12 L138 37 L146 62 Z" fill="' + c[1] + '"/>' +
      '<path d="M58 14 Q72 -2 88 16 Z" fill="' + c[1] + '"/>' +
      '<ellipse cx="62" cy="37" rx="54" ry="25" fill="' + c[0] + '"/>' +
      '<path d="M70 40 Q82 50 92 42" fill="none" stroke="' + c[1] + '" stroke-width="4" stroke-linecap="round"/>' +
      '<circle cx="28" cy="31" r="6.5" fill="#0b2540"/><circle cx="26" cy="29" r="2" fill="#fff"/></svg>';
    $('#fishLayer').appendChild(el);
    fish.push({ el: el, tail: el.querySelector('.tail'), ph: rnd() * 6.28, sc: .55 + rnd() * .3, sp: 60 + rnd() * 50 });
  }
  function seaPath(Y, t, amp) {
    var p = 'M0 1920 L0 ' + Y;
    for (var x = 0; x <= 1080; x += 20) p += ' L' + x + ' ' + (Y + Math.sin(x / 70 + t * 2.2) * amp + Math.sin(x / 31 - t * 1.4) * amp * .4).toFixed(1);
    return p + ' L1080 1920 Z';
  }

  var SWIPE = .32; // half-length of a swipe between slides (design seconds)
  function drawAt(t) {
    // Sea breathes like a slow tide; boat bobs; lighthouse beam sweeps
    var Y = 1690 + Math.sin(t * .35) * 18;
    $('#wv').setAttribute('d', seaPath(Y, t, 8));
    $('#boat').setAttribute('transform', 'translate(520,' + (Y - 16) + ') rotate(' + (Math.sin(t * 1.7) * 3) + ')');
    $('#beam').setAttribute('transform', 'rotate(' + (Math.sin(t * 1.3) * 10) + ' 990 1389)');
    fish.forEach(function (f, i) {
      var dir = i % 2 ? 1 : -1, ln = t * f.sp + i * 230;
      var x = dir > 0 ? (ln % 1400) - 160 : 1240 - (ln % 1400);
      var y = Y + 90 + (i % 3) * 60;
      f.el.style.transform = 'translate(' + x + 'px,' + (y + Math.sin(t * 2.2 + f.ph) * 6) + 'px) scale(' + (dir > 0 ? -f.sc : f.sc) + ',' + f.sc + ')';
      f.el.style.opacity = clamp(t / .6);
      f.tail.setAttribute('transform', 'rotate(' + (Math.sin(t * 9 + f.ph) * 14) + ' 108 37)');
    });

    // Carousel: each slide enters from the left and leaves to the right (RTL reading order)
    var cur = 0;
    slides.forEach(function (s, k) {
      var a = DESIGN[k], b = DESIGN[k + 1];
      var x = 0;
      if (k > 0 && t < a + SWIPE) x = -1080 * (1 - seg(t, a - SWIPE, a + SWIPE));
      if (k < slides.length - 1 && t > b - SWIPE) x = 1080 * seg(t, b - SWIPE, b + SWIPE);
      s.style.transform = 'translateX(' + x + 'px)';
      s.style.visibility = Math.abs(x) >= 1079 ? 'hidden' : 'visible';
      if (t >= a - SWIPE * .2) cur = k;
    });
    dots.forEach(function (d, k) { d.className = k === cur ? 'on' : ''; });

    // Cover
    show($('#c0 .kick'), seg(t, .1, .5), 20 * (1 - seg(t, .1, .6, out)));
    show($('#c0 .t'), seg(t, .3, .8), 40 * (1 - seg(t, .3, .9, out)));
    show($('#c0 .sub'), seg(t, 1.2, 1.6), 20 * (1 - seg(t, 1.2, 1.7, out)));
    ringImgs.forEach(function (im, n) {
      var p = seg(t, 1.8 + n * .3, 2.3 + n * .3, out);
      im.style.opacity = p;
      im.style.transform = 'translate(' + RING[n][0] + 'px,' + (RING[n][1] + Math.sin(t * 1.4 + n) * 8) + 'px) scale(' + (.5 + .5 * p) + ')';
    });

    // Fish slides: photo, then name, local names one by one, fact, and the question
    FISH.forEach(function (f, n) {
      var s = slides[n + 1], a = DESIGN[n + 1], b = DESIGN[n + 2];
      s.querySelector('.img').style.transform = 'scale(' + (1 + .06 * clamp((t - a) / (b - a))) + ')';
      show(s.querySelector('.name'), seg(t, a + .25, a + .65), 30 * (1 - seg(t, a + .25, a + .75, out)));
      show(s.querySelector('.sci'), seg(t, a + .5, a + .9), 0);
      s.querySelectorAll('.chip').forEach(function (ch, m) {
        var p = seg(t, a + .8 + m * .45, a + 1.2 + m * .45, out);
        ch.style.opacity = p; ch.style.transform = 'scale(' + (.7 + .3 * p) + ')';
      });
      show(s.querySelector('.fact'), seg(t, a + 2.3, a + 2.8), 24 * (1 - seg(t, a + 2.3, a + 2.9, out)));
      var ask = s.querySelector('.ask'), pa = seg(t, a + 3.6, a + 4, out);
      ask.style.opacity = pa; ask.style.transform = 'scale(' + (.8 + .2 * pa + Math.sin(t * 5) * .015 * pa) + ')';
    });

    // End card
    var e = DESIGN[7];
    $('#c7 .logo').style.transform = 'scale(' + (.6 + .4 * seg(t, e, e + .7, out)) + ')';
    show($('#c7 .q'), seg(t, e + .3, e + .7), 30 * (1 - seg(t, e + .3, e + .8, out)));
    show($('#c7 .p'), seg(t, e + 1.2, e + 1.6), 20 * (1 - seg(t, e + 1.2, e + 1.7, out)));
    show($('#c7 .cm'), seg(t, e + 2, e + 2.4), Math.sin(t * 4) * 10);
    show($('#c7 .url'), seg(t, e + 2.6, e + 3), 20 * (1 - seg(t, e + 2.6, e + 3.1, out)));
  }

  // Timeline remap: scenes designed on DESIGN; a voiceover can stretch them to REAL.
  var REAL = DESIGN.slice();
  window.setTimeline = function (real) { REAL = real; window.DURATION = real[real.length - 1]; };
  window.renderAt = function (t) {
    var i = 0;
    while (i < REAL.length - 2 && t >= REAL[i + 1]) i++;
    var p = Math.min(1, (t - REAL[i]) / (REAL[i + 1] - REAL[i]));
    drawAt(DESIGN[i] + p * (DESIGN[i + 1] - DESIGN[i]) + Math.max(0, t - REAL[REAL.length - 1]));
  };
  window.DURATION = DESIGN[DESIGN.length - 1];
  var q = new URLSearchParams(location.search);
  window.renderAt(q.has('t') ? +q.get('t') : 0);
</script>
</body>
</html>
