<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ArabTides — فيديو أين تصطاد حسب المد</title>
<link rel="stylesheet" href="brand.css">
<style>
  /* 1080×1920 Reel. Frames are rendered by calling window.renderAt(seconds).
     Reels safe area: keep text inside x 90–930, y 230–1480. */
  html, body { background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: #fff;
    background: linear-gradient(180deg, #06162a 0%, #0b2540 30%, #134a66 55%, #2b6f7e 66%); }
  .scene { position: absolute; inset: 0; padding: 0 100px; display: flex; flex-direction: column; align-items: center; text-align: center; opacity: 0; }
  .k { font-family: var(--font-num); direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
  .d { font-family: var(--font-display); font-weight: 700; word-spacing: .12em; }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  /* left/top 0: in RTL an unanchored absolute box starts at the right edge */
  .fish, .star { left: 0; top: 0; }
  .fish { position: absolute; width: 150px; height: 75px; margin: -37px 0 0 -75px; will-change: transform; }
  .star { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #fff; }
  #world { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .h1 { text-shadow: 0 4px 24px rgba(6, 22, 42, .6); }

  #s1 .q { margin-top: 270px; font-size: 136px; line-height: 1.2; }
  #s1 .a { margin-top: 36px; font-size: 64px; color: var(--lagoon); font-weight: 700; }
  #s2 .h, #s3 .h, #s4 .h { margin-top: 250px; font-size: 104px; }
  #s2 .sub, #s3 .sub, #s4 .sub { margin-top: 20px; font-size: 60px; color: var(--sand); font-weight: 700; line-height: 1.4; }
  #s4 .warn { margin-top: 26px; font-size: 52px; font-weight: 700; color: #fda4af; }
  #s5 { justify-content: flex-start; padding-top: 250px; }
  #s5 img { width: 230px; height: 230px; }
  #s5 .wm { font-family: var(--font-num); font-weight: 800; font-size: 108px; letter-spacing: -.02em; margin-top: 26px; direction: ltr; }
  #s5 .p { font-size: 62px; margin-top: 30px; }
  #s5 .url { font-family: var(--font-num); font-weight: 800; font-size: 92px; color: var(--lagoon); margin-top: 14px; direction: ltr; }
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="stars"></div>

  <svg id="world" viewBox="0 0 1080 1920" aria-hidden="true">
    <defs>
      <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".55"/><stop offset=".25" stop-color="#0d6e7a" stop-opacity=".8"/><stop offset="1" stop-color="#0a3f55" stop-opacity=".95"/></linearGradient>
      <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6c88f"/><stop offset="1" stop-color="#b8925a"/></linearGradient>
      <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#64707c"/><stop offset="1" stop-color="#2f3943"/></linearGradient>
      <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9aa5ae"/><stop offset="1" stop-color="#6b7681"/></linearGradient>
      <radialGradient id="moonGlow"><stop offset="0" stop-color="#fde68a" stop-opacity=".5"/><stop offset="1" stop-color="#fde68a" stop-opacity="0"/></radialGradient>
      <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fde68a" stop-opacity=".55"/><stop offset="1" stop-color="#fde68a" stop-opacity="0"/></linearGradient>
    </defs>
    <circle cx="150" cy="170" r="110" fill="url(#moonGlow)"/><circle cx="150" cy="170" r="38" fill="#fde68a"/>

    <!-- 1 · Panorama: rocks · beach · port -->
    <g id="g1">
      <path d="M0 1250 C40 1160 90 1120 150 1130 C200 1080 260 1100 300 1170 C320 1200 330 1230 340 1250 Z" fill="url(#rock)"/>
      <path d="M330 1250 C420 1200 560 1195 700 1250 Z" fill="url(#sand)"/>
      <rect x="720" y="1170" width="360" height="90" fill="url(#wall)"/>
      <path d="M965 1170 L975 960 L1005 960 L1015 1170 Z" fill="#f4f8f9"/><path d="M969 1095 h42 v28 h-42z M972 1020 h36 v26 h-36z" fill="#f43f5e"/><rect x="965" y="935" width="50" height="28" rx="6" fill="#fde68a"/>
      <path id="beam1" d="M990 949 L560 905 L560 995 Z" fill="url(#beam)"/>
      <path class="wv" fill="url(#sea)"/>
      <g font-family="Noto Naskh Arabic" font-size="46" font-weight="700" text-anchor="middle" fill="#fff">
        <text id="l1" x="170" y="1060">🪨 الصخور</text><text id="l2" x="515" y="1150">🏖️ الشاطئ</text><text id="l3" x="830" y="1130">⚓ الميناء</text>
      </g>
    </g>

    <!-- 2 · Beach: the sea climbs the sand -->
    <g id="g2">
      <path d="M1080 1000 L0 1750 L0 1920 L1080 1920 Z" fill="url(#sand)"/>
      <g id="palm"><path d="M985 1065 C982 990 972 930 958 870" stroke="#8b5e34" stroke-width="16" fill="none" stroke-linecap="round"/>
        <path d="M958 870 C920 840 880 845 850 870 M958 870 C930 820 900 805 870 805 M958 870 C985 820 1015 812 1045 825 M958 870 C1000 850 1040 860 1060 890 M958 870 C960 830 955 800 945 780" stroke="#2f8f5b" stroke-width="14" fill="none" stroke-linecap="round"/></g>
      <path class="wv" fill="url(#sea)"/>
      <ellipse id="foam" rx="70" ry="9" fill="#f4f8f9" opacity=".8"/>
      <g id="ang2" class="angler"></g>
    </g>

    <!-- 3 · Port: breakwater with a lighthouse, boat at its mooring -->
    <g id="g3">
      <path d="M0 1800 C300 1780 500 1810 700 1790 L1080 1790 V1920 H0Z" fill="#a7865a"/>
      <path d="M640 1080 L1080 1080 L1080 1920 L600 1920 Z" fill="url(#wall)"/>
      <g stroke="#5b6670" stroke-width="3" opacity=".7"><path d="M635 1180 H1080 M630 1300 H1080 M622 1420 H1080 M615 1540 H1080 M608 1660 H1080 M603 1780 H1080"/></g>
      <g fill="#7d8892" stroke="#56616b" stroke-width="3"><circle cx="640" cy="1110" r="34"/><circle cx="612" cy="1215" r="38"/><circle cx="602" cy="1340" r="40"/><circle cx="596" cy="1480" r="42"/><circle cx="590" cy="1620" r="44"/></g>
      <path d="M930 1080 L945 760 L995 760 L1010 1080 Z" fill="#f4f8f9"/>
      <path d="M936 960 h68 v40 h-68z M940 850 h60 v36 h-60z" fill="#f43f5e"/>
      <rect x="932" y="722" width="76" height="42" rx="8" fill="#fde68a"/><path d="M928 722 L970 690 L1012 722Z" fill="#f43f5e"/>
      <path id="beam3" d="M970 743 L380 680 L380 810 Z" fill="url(#beam)"/>
      <g id="boat"><path d="M-110 0 L110 0 L80 46 L-80 46 Z" fill="#f4f8f9"/><path d="M-110 0 L110 0 L104 12 L-104 12Z" fill="#0d9488"/><line x1="0" y1="0" x2="0" y2="-170" stroke="#e2e8f0" stroke-width="6"/><path d="M6 -160 L80 -20 L6 -20Z" fill="#fde68a" opacity=".9"/></g>
      <path class="wv" fill="url(#sea)"/>
      <g id="ang3" class="angler"></g>
    </g>

    <!-- 4 · Rocks: low tide, then the sea cuts the path back -->
    <g id="g4">
      <path d="M0 1700 C200 1660 400 1720 600 1690 S900 1700 1080 1680 V1920 H0Z" fill="#8a7350"/>
      <path d="M60 1720 C70 1450 120 1300 200 1290 C260 1285 290 1400 300 1720Z" fill="url(#rock)"/>
      <path d="M300 1720 C300 1300 340 1120 420 1090 C480 1065 560 1060 620 1085 C700 1110 740 1250 765 1720 Z" fill="url(#rock)"/>
      <path d="M700 1720 C705 1330 735 1205 785 1196 L870 1192 C905 1198 925 1300 940 1720Z" fill="url(#rock)"/>
      <path d="M880 1720 C900 1300 940 1060 1000 1040 L1080 1030 L1080 1920 L880 1920Z" fill="url(#rock)"/>
      <g stroke="#2f8f5b" stroke-width="7" fill="none" stroke-linecap="round" opacity=".8"><path d="M330 1700 q-12 -50 6 -95 M360 1700 q14 -40 -4 -80 M760 1700 q-10 -60 8 -110 M930 1700 q10 -45 -6 -90"/></g>
      <path class="wv" fill="url(#sea)"/>
      <g id="cut" opacity="0"><circle cx="830" cy="1090" r="34" fill="#f43f5e"/><path d="M830 1070 v26 M830 1106 v2" stroke="#fff" stroke-width="8" stroke-linecap="round"/></g>
      <g id="ang4" class="angler"></g>
    </g>
  </svg>

  <div class="scene" id="s1">
    <div class="d q h1">أين تصطاد<br>اليوم؟</div>
    <div class="a h1">الجواب يعتمد على المد 🌊</div>
  </div>
  <div class="scene" id="s2">
    <div class="d h h1">الشاطئ الرملي</div>
    <div class="sub h1">اصطد مع المد الصاعد</div>
  </div>
  <div class="scene" id="s3">
    <div class="d h h1">حاجز الميناء</div>
    <div class="sub h1">حول المد العالي</div>
  </div>
  <div class="scene" id="s4">
    <div class="d h h1">الصخور</div>
    <div class="sub h1">ابدأ مع الجزر<br>وعُد قبل منتصف المد</div>
    <div class="warn h1">⚠️ الماء قد يقطع طريق العودة</div>
  </div>
  <div class="scene" id="s5">
    <img src="../logo/arabtides-mark.svg" alt="">
    <div class="wm">ArabTides</div>
    <div class="p h1">متى المد في ميناءك؟</div>
    <div class="url">arabtides.com</div>
  </div>

  <div class="layer" id="fishLayer"></div>
</div>

<script>
  var $ = function (s) { return document.querySelector(s); };
  var clamp = function (x) { return Math.max(0, Math.min(1, x)); };
  var ease = function (x) { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  var out = function (x) { x = clamp(x); return 1 - Math.pow(1 - x, 3); };
  var seg = function (t, a, b, f) { return (f || ease)((t - a) / (b - a)); };
  var vis = function (t, a, b, d) { d = d || .4; return Math.min(seg(t, a, a + d, out), 1 - seg(t, b - d, b)); };
  var show = function (el, o, dy) { el.style.opacity = o; el.style.transform = 'translateY(' + (dy || 0) + 'px)'; };
  var lerp = function (a, b, p) { return a + (b - a) * p; };
  var seed = 31, rnd = function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };

  // Scene boundaries in design seconds (voiceover.mjs reads this line)
  var DESIGN = [0, 4.5, 11, 17.5, 24, 28];

  // --- Fish: a body, a wagging tail, a fin and an eye; faces left in its own coordinates
  var COLORS = [['#2dd4bf', '#14b8a6'], ['#fde68a', '#f5c94a'], ['#5eead4', '#0d9488'], ['#fca5a5', '#f87171'], ['#93c5fd', '#60a5fa']];
  var fish = [];
  for (var i = 0; i < 8; i++) {
    var c = COLORS[i % COLORS.length], el = document.createElement('div');
    el.className = 'fish';
    el.innerHTML = '<svg viewBox="0 0 150 75" width="150" height="75">' +
      '<path class="tail" d="M108 37 L146 12 L138 37 L146 62 Z" fill="' + c[1] + '"/>' +
      '<path d="M58 14 Q72 -2 88 16 Z" fill="' + c[1] + '"/>' +
      '<ellipse cx="62" cy="37" rx="54" ry="25" fill="' + c[0] + '"/>' +
      '<path d="M70 40 Q82 50 92 42" fill="none" stroke="' + c[1] + '" stroke-width="4" stroke-linecap="round"/>' +
      '<circle cx="28" cy="31" r="6.5" fill="#0b2540"/><circle cx="26" cy="29" r="2" fill="#fff"/></svg>';
    $('#fishLayer').appendChild(el);
    fish.push({ el: el, tail: el.querySelector('.tail'), ph: rnd() * 6.28, sc: .6 + rnd() * .35 });
  }
  function putFish(f, x, y, dir, t, w, o) {
    var bob = Math.sin(t * 2.2 + f.ph) * 6;
    f.el.style.transform = 'translate(' + x + 'px,' + (y + bob) + 'px) scale(' + (dir > 0 ? -f.sc : f.sc) + ',' + f.sc + ')';
    f.el.style.opacity = o;
    f.tail.setAttribute('transform', 'rotate(' + (Math.sin(t * w + f.ph) * 14) + ' 108 37)');
  }
  for (var j = 0; j < 45; j++) { var s = document.createElement('div'); s.className = 'star'; s.style.transform = 'translate(' + (rnd() * 1080) + 'px,' + (rnd() * 760) + 'px)'; s.dataset.ph = rnd() * 6.28; $('#stars').appendChild(s); }

  // Sea surface: a gentle moving wave at level Y, filled down to the bottom
  function seaPath(Y, t, amp) {
    var p = 'M0 1920 L0 ' + Y;
    for (var x = 0; x <= 1080; x += 20) p += ' L' + x + ' ' + (Y + Math.sin(x / 70 + t * 2.2) * amp + Math.sin(x / 31 - t * 1.4) * amp * .4).toFixed(1);
    return p + ' L1080 1920 Z';
  }
  var waves = document.querySelectorAll('.wv');

  // Angler: stands with feet at (x, y), rod tip up-left, line down to the water at (lx, ly)
  function angler(g, x, y, lx, ly, t, walking) {
    var step = walking ? Math.sin(t * 12) * 14 : 0;
    var tipX = x - 120, tipY = y - 210 + Math.sin(t * 1.6) * 4;
    g.innerHTML =
      '<line x1="' + x + '" y1="' + (y - 70) + '" x2="' + (x - 14 + step) + '" y2="' + y + '" stroke="#0b2540" stroke-width="13" stroke-linecap="round"/>' +
      '<line x1="' + x + '" y1="' + (y - 70) + '" x2="' + (x + 14 - step) + '" y2="' + y + '" stroke="#0b2540" stroke-width="13" stroke-linecap="round"/>' +
      '<line x1="' + x + '" y1="' + (y - 70) + '" x2="' + x + '" y2="' + (y - 150) + '" stroke="#0f3d5c" stroke-width="26" stroke-linecap="round"/>' +
      '<circle cx="' + x + '" cy="' + (y - 178) + '" r="20" fill="#e8b98a"/>' +
      '<path d="M' + (x - 26) + ' ' + (y - 186) + ' Q' + x + ' ' + (y - 222) + ' ' + (x + 26) + ' ' + (y - 186) + 'Z" fill="#fde68a"/>' +
      (walking ? '' :
      '<line x1="' + (x - 10) + '" y1="' + (y - 130) + '" x2="' + tipX + '" y2="' + tipY + '" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>' +
      '<path d="M' + tipX + ' ' + tipY + ' Q' + ((tipX + lx) / 2) + ' ' + (Math.max(tipY, ly) - 30) + ' ' + lx + ' ' + ly + '" stroke="rgba(255,255,255,.75)" stroke-width="2.5" fill="none"/>' +
      '<circle cx="' + lx + '" cy="' + ly + '" r="7" fill="#f43f5e"/>');
  }

  // Beach geometry: sand surface falls from (1080, 1000) to (0, 1750)
  var sandY = function (x) { return 1000 + (1080 - x) * 750 / 1080; };
  var shoreX = function (Y) { return 1080 - (Y - 1000) * 1080 / 750; };
  // Rocks: the angler's way back to the shore
  var PATH = [[540, 1062], [640, 1080], [700, 1128], [735, 1222], [790, 1197], [865, 1192], [935, 1075], [990, 1040]];
  function along(p) { // point at fraction p of the polyline
    var L = [], tot = 0;
    for (var n = 1; n < PATH.length; n++) { var d = Math.hypot(PATH[n][0] - PATH[n - 1][0], PATH[n][1] - PATH[n - 1][1]); L.push(d); tot += d; }
    var r = p * tot;
    for (n = 0; n < L.length; n++) { if (r <= L[n]) { var q = r / L[n]; return [lerp(PATH[n][0], PATH[n + 1][0], q), lerp(PATH[n][1], PATH[n + 1][1], q)]; } r -= L[n]; }
    return PATH[PATH.length - 1];
  }

  function drawAt(t) {
    document.querySelectorAll('.star').forEach(function (s) { s.style.opacity = .3 + .4 * (.5 + .5 * Math.sin(t * 2 + +s.dataset.ph)); });
    var s1 = vis(t, 0, 4.5), s2 = vis(t, 4.5, 11), s3 = vis(t, 11, 17.5), s4 = vis(t, 17.5, 24), s5 = seg(t, 24, 24.5, out);
    $('#s1').style.opacity = 1; $('#s2').style.opacity = s2; $('#s3').style.opacity = s3; $('#s4').style.opacity = s4; $('#s5').style.opacity = s5;
    $('#g1').style.opacity = Math.max(clamp(t / .5) * (1 - seg(t, 4.1, 4.5)), s5);
    $('#g2').style.opacity = s2; $('#g3').style.opacity = s3; $('#g4').style.opacity = s4;

    // Water level per scene
    var Y1 = 1250;
    var Y2 = lerp(1330, 1170, seg(t, 5.6, 9.6));
    var Y3 = 1140 + Math.sin(t * .8) * 6;
    var Y4 = lerp(1405, 1150, seg(t, 20.4, 23));
    var Ys = [Y1, Y2, Y3, Y4];
    waves.forEach(function (w, n) { w.setAttribute('d', seaPath(Ys[n], t, n === 1 ? 7 : 9)); });

    // Scene 1: title, labels pop in turn, lighthouse beam sweeps
    show($('#s1 .q'), Math.min(seg(t, .2, .8), 1 - seg(t, 4.1, 4.5)), 40 * (1 - seg(t, .2, .9, out)));
    show($('#s1 .a'), Math.min(seg(t, 2.6, 3.1), 1 - seg(t, 4.1, 4.5)), 30 * (1 - seg(t, 2.6, 3.2, out)));
    ['#l1', '#l2', '#l3'].forEach(function (id, n) { $(id).style.opacity = seg(t, 1.2 + n * .45, 1.6 + n * .45) * (t < 24 ? 1 : 0); });
    $('#beam1').setAttribute('transform', 'rotate(' + (Math.sin(t * 1.3) * 10) + ' 990 949)');
    $('#beam3').setAttribute('transform', 'rotate(' + (Math.sin(t * 1.3) * 9) + ' 970 743)');

    // Scene 2: shoreline climbs, foam rides it, the angler steps back with the tide
    var xs = shoreX(Y2);
    $('#foam').setAttribute('cx', xs - 40); $('#foam').setAttribute('cy', Y2 + 2); $('#foam').setAttribute('rx', 60 + Math.sin(t * 3) * 20);
    var ax = Math.min(xs + 110, 1000);
    angler($('#ang2'), ax, sandY(ax), xs - 260, Y2 + 4, t, false);

    // Scene 3: boat bobs at its mooring, angler on the wall casts beside it
    $('#boat').setAttribute('transform', 'translate(300,' + (Y3 - 22) + ') rotate(' + (Math.sin(t * 1.7) * 3) + ')');
    angler($('#ang3'), 700, 1080, 530, Y3 + 4, t, false);

    // Scene 4: angler fishes, then walks back across the rocks before the water cuts the path
    var wk = seg(t, 19.8, 21.4, function (x) { return clamp(x); });
    var pos = along(wk);
    angler($('#ang4'), pos[0], pos[1], 330, Y4 + 4, t, wk > 0 && wk < 1);
    $('#cut').style.opacity = seg(t, 22.1, 22.4) * s4;
    show($('#s4 .warn'), seg(t, 22, 22.4), 16 * (1 - seg(t, 22, 22.5, out)));
    show($('#s4 .sub'), seg(t, 18.2, 18.6), 0);

    // --- Fish choreography (stage px)
    fish.forEach(function (f, i) {
      var x, y, dir = 1, w = 8, o = 0, k = i % 4;
      if (t < 4.5) {                                    // panorama: lazy drift below the surface
        dir = i % 2 ? 1 : -1;
        var ln = t * (40 + i * 6) + i * 170;
        x = dir > 0 ? (ln % 1300) - 110 : 1190 - (ln % 1300);
        y = 1360 + (i % 4) * 100; w = 5; o = clamp(t / .6) * (1 - seg(t, 4.1, 4.5));
      } else if (t < 11) {                              // beach: fish follow the rising water toward the shore
        var xs2 = shoreX(Y2), g = seg(t, 5.8 + k * .3, 9.4 + k * .3);
        x = lerp(-120 - k * 60, xs2 - 170 - k * 110, g) + Math.sin(t * 1.5 + i) * 12;
        y = Math.min(Y2 + 70 + (i % 3) * 60, sandY(x) - 45);
        dir = g < .97 ? 1 : (Math.sin(t * 1.2 + i) > 0 ? 1 : -1); w = g < .97 ? 14 : 8;
        o = s2 * (i < 6 ? 1 : 0) * clamp((sandY(x) - 45 - (Y2 + 40)) / 30);
      } else if (t < 17.5) {                            // port: fish circle along the foot of the wall
        var a = t * (.9 + k * .1) + i * 1.7;
        x = 470 + Math.cos(a) * 75 - (i % 2) * 40; y = 1290 + (i % 6) * 75 + Math.sin(a) * 18;
        dir = -Math.sin(a) > 0 ? 1 : -1; w = 9; o = s3 * (i < 7 ? 1 : 0);
      } else if (t < 24) {                              // rocks: fish swim into the gullies as the water rises
        var spots = [[250, 1500], [330, 1600], [700, 1560], [800, 1450], [830, 1600], [160, 1620], [600, 1640], [880, 1520]];
        var sp = spots[i], g4 = seg(t, 18.4 + k * .35, 20.6 + k * .35);
        x = lerp(i % 2 ? 1200 : -120, sp[0], g4) + Math.sin(t * 1.6 + i) * 14; y = sp[1] + Math.sin(t * 1.1 + i) * 10;
        dir = g4 < .97 ? (i % 2 ? -1 : 1) : (Math.sin(t * 1.3 + i) > 0 ? 1 : -1); w = g4 < .97 ? 13 : 7;
        o = s4 * clamp((y - Y4 - 40) / 40);
      } else {                                          // end card: lanes under the panorama surface
        dir = i % 2 ? 1 : -1;
        var l5 = (t - 24) * 90 + i * 210;
        x = dir > 0 ? (l5 % 1400) - 160 : 1240 - (l5 % 1400);
        y = 1380 + (i % 3) * 110; o = s5 * (i < 6 ? 1 : 0); w = 9;
      }
      putFish(f, x, y, dir, t, w, o);
    });

    $('#s5 img').style.transform = 'scale(' + (.6 + .4 * seg(t, 24, 24.8, out)) + ')';
    show($('#s5 .p'), seg(t, 24.6, 25), 20 * (1 - seg(t, 24.6, 25.1, out)));
    show($('#s5 .url'), seg(t, 24.9, 25.3), 20 * (1 - seg(t, 24.9, 25.4, out)));
  }

  // Timeline remap: scenes designed on DESIGN; a voiceover can stretch them to REAL.
  var REAL = DESIGN.slice();
  window.setTimeline = function (real) { REAL = real; window.DURATION = real[real.length - 1]; };
  window.renderAt = function (t) {
    var i = 0;
    while (i < REAL.length - 2 && t >= REAL[i + 1]) i++;
    var p = Math.min(1, (t - REAL[i]) / (REAL[i + 1] - REAL[i]));
    drawAt(DESIGN[i] + p * (DESIGN[i + 1] - DESIGN[i]) + Math.max(0, t - REAL[REAL.length - 1]));
  };
  window.DURATION = DESIGN[DESIGN.length - 1];
  var q = new URLSearchParams(location.search);
  window.renderAt(q.has('t') ? +q.get('t') : 0);
</script>
