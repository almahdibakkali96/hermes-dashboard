<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ArabTides — صورة المشاركة</title>
<link rel="stylesheet" href="brand.css">
<style>
  /* 1200×630 Open Graph image, used when a page is shared (public/og-default.png) */
  html, body { margin: 0; }
  .og { width: 1200px; height: 630px; position: relative; overflow: hidden; color: #fff; padding: 80px 90px;
    background: radial-gradient(700px 400px at 85% 0%, rgba(45, 212, 191, .25), transparent 60%),
                linear-gradient(160deg, #0b2540 0%, #0f3d5c 60%, #0d5c63 100%); }
  .top { display: flex; align-items: center; gap: 22px; direction: ltr; justify-content: flex-end; }
  .top img { width: 84px; height: 84px; }
  .top .en { font-family: var(--font-num); font-weight: 800; font-size: 52px; letter-spacing: -.02em; }
  h1 { font-family: var(--font-display); font-size: 84px; line-height: 1.2; margin-top: 50px; word-spacing: .12em; }
  h1 span { color: var(--lagoon); }
  p { font-size: 34px; color: #cbd5e1; margin-top: 18px; }
  .url { position: absolute; left: 90px; bottom: 70px; font-family: var(--font-num); font-weight: 700; font-size: 34px; color: var(--lagoon); direction: ltr; }
  svg.w { position: absolute; left: 0; bottom: 0; width: 1200px; height: 120px; }
</style>
</head>
<body>
<div class="og">
  <div class="top"><span class="en">ArabTides</span><img src="../logo/arabtides-mark.svg" alt=""></div>
  <h1>مواقيت المد والجزر<br><span>للموانئ العربية</span></h1>
  <p>أفضل أيام الصيد · أطوار القمر · 36 ميناءً</p>
  <div class="url">arabtides.com</div>
  <svg class="w" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 60c100-30 200-30 300 0s200 30 300 0 200-30 300 0 200 30 300 0v60H0z" fill="rgba(45,212,191,.12)"/>
    <path d="M0 90c100-22 200-22 300 0s200 22 300 0 200-22 300 0 200 22 300 0v30H0z" fill="rgba(45,212,191,.18)"/>
  </svg>
</div>
</body>
</html>
