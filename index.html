<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d0d;
      color: #e0e0e0;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .container { text-align: center; padding: 2rem; }
    h1 { font-size: 2.5rem; font-weight: 300; letter-spacing: -0.5px; margin-bottom: 0.5rem; color: #fff; }
    .tagline { color: #888; font-size: 1rem; margin-bottom: 2rem; }
    .status { display: inline-block; padding: 0.4rem 1rem; border-radius: 20px; 
              background: #1a3a1a; color: #4ade80; font-size: 0.85rem; }
    .dot { display: inline-block; width: 8px; height: 8px; background: #4ade80; 
           border-radius: 50%; margin-right: 6px; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    footer { margin-top: 3rem; color: #444; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hermes Dashboard</h1>
    <p class="tagline">Still Point Press &middot; Coming soon</p>
    <div class="status"><span class="dot"></span>Live on GitHub Pages</div>
    <footer>almahdibakkali96.github.io/hermes-dashboard</footer>
  </div>
</body>
</html>
